name: Service token smoke

# Checks a workspace service token against production the way a CI job uses
# one: the CLI built from this checkout, UPLOADS_TOKEN only. See
# scripts/smoke-service-token.mjs for what it asserts.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1" # Mondays
  pull_request:
    paths:
      - .github/workflows/service-token-smoke.yml
      - scripts/smoke-service-token.mjs

concurrency:
  group: service-token-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Upload, attribution, delete
    # Fork PRs get no secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPLOADS_TOKEN: ${{ secrets.UPLOADS_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter @buildinternet/uploads run build

      - name: Run the smoke
        run: node scripts/smoke-service-token.mjs
