<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uploads MCP Apps · Local SDK harness</title>
  </head>
  <body style="margin: 0; background: #f4f3f6; color: #28252d; font: 14px system-ui">
    <header style="padding: 20px 24px; border-bottom: 1px solid #ddd; background: #fff">
      <strong>Local SDK harness</strong>
      <p>
        This tests the MCP Apps bridge. It does not prove OpenAI sidebar or desktop compatibility.
      </p>
      <label
        >Layout
        <select id="layout">
          <option value="wide">Wide</option>
          <option value="narrow">Narrow panel</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select></label
      >
      <p id="harness-status" role="status">Connecting to the fixture server…</p>
    </header>
    <iframe
      id="app"
      title="Staged media demo"
      sandbox="allow-scripts"
      style="
        display: block;
        width: min(900px, 100%);
        height: 1000px;
        border: 0;
        margin: 24px auto;
        background: #fff;
      "
    ></iframe>
    <script type="module" src="/src/harness.js"></script>
  </body>
</html>
