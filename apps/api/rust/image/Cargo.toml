[package]
name = "uploads-image"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
